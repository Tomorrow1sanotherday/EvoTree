[project]
name = "evotree"
version = "0.1.0"
description = "EvoTree: Self-Evolving Hybrid Agents via Tree-Structured Experience Memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 核心记忆系统仅用标准库（dataclass/json/math），保持轻量、零外部依赖。
    # 未来接入 embedding 模板匹配 / VLM 清洗时再按需添加。
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evotree"]

[tool.pytest.ini_options]
testpaths = ["tests"]
